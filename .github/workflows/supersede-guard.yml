name: supersede-guard

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: SUPERSEDED banner invariants
        run: python -m unittest discover -s tests_governance -p "test_*.py"
      - name: Claim-0 offline suite
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
